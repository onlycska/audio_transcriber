[project]
name = "audio-transcriber"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.2,<3.0",
    "pyannote-audio>=4.0.1",
    "mlx-whisper>=0.4.3",
    "soundfile",
    "loguru>=0.7.3",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "pyright>=1.1.408",
]

[tool.uv]
no-binary-package = ["numpy"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
