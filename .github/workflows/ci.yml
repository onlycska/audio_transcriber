name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-type-test:
    name: lint-type-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ruff
        run: uv run --with ruff ruff check .

      - name: Pyright
        run: uv run --with pyright pyright

      - name: Pytest
        run: uv run --with pytest pytest tests/
